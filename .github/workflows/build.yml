name: Build

on:
  push:
    branches: [ main, 'product*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: チェックアウト
        uses: actions/checkout@v7

      - name: .NET SDK のセットアップ
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: テスト
        run: dotnet test AppRoulette/AppRoulette.Tests/AppRoulette.Tests.csproj -c Release -p:Platform=x64

      - name: exe 版の発行
        run: dotnet publish AppRoulette/AppRoulette/AppRoulette.csproj -c Release -p:Platform=x64 -p:PublishProfile=exe-win-x64 -o publish/win-x64

      - name: exe 版をアーティファクトとして保存
        uses: actions/upload-artifact@v7
        with:
          name: AppRoulette-win-x64
          path: publish/win-x64/
          retention-days: 14
